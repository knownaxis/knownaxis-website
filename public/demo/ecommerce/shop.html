<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Collections — URBANisty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
<header id="site-header"></header>

<!-- Banner -->
<section class="page-banner">
  <div class="wrap">
    <div class="badge cyan" style="margin-bottom:12px;">Autumn / Winter 2026 Drop</div>
    <h1>Men's &amp; Women's Collection</h1>
    <div class="crumb"><a href="index.html">Home</a> / Shop</div>
  </div>
</section>

<div class="wrap section">
  <div class="sec-head" style="margin-bottom:24px; flex-wrap:wrap; gap:16px;">
    <!-- Category Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterCategory('all', this)">All Items (8)</button>
      <button class="filter-tab" onclick="filterCategory('outerwear', this)">Outerwear &amp; Jackets</button>
      <button class="filter-tab" onclick="filterCategory('apparel', this)">Tops &amp; Pants</button>
      <button class="filter-tab" onclick="filterCategory('footwear', this)">Footwear &amp; Bags</button>
    </div>

    <!-- Sorting Selection -->
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="color:var(--muted); font-size:13px;" id="item-count-label">Showing 8 results</span>
      <select class="field" style="width:190px; margin:0; padding:10px 14px;" onchange="sortProducts(this.value)">
        <option value="default">Featured Order</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>
  </div>

  <!-- Product Tilt Grid -->
  <div class="pgrid" id="shop-products"></div>
</div>

<footer id="site-footer"></footer>
<script src="common.js"></script>
<script>
const items = [
  {id:1, n:"Modular Cyber Jacket", cat:"outerwear", img:"product-cyber-jacket.jpg", price:145, old:"$220", sale:true, star:true},
  {id:2, n:"Aether Neon Runners", cat:"footwear", img:"product-sneaker.jpg", price:120, old:"$180", sale:true, star:true},
  {id:3, n:"Tactical Carbon Backpack", cat:"footwear", img:"product-backpack.jpg", price:95, old:"$135", sale:true},
  {id:4, n:"Modular Polo Tech", cat:"apparel", img:"Product-men's polo shirt.webp", price:35, old:"$55", sale:true},
  {id:5, n:"Active Aero Shorts", cat:"apparel", img:"product-men's short.avif", price:35},
  {id:6, n:"Cyber Beanie Thermal", cat:"outerwear", img:"product-beanie.png", price:15, old:"$25", sale:true},
  {id:7, n:"Matrix Polarized Shades", cat:"footwear", img:"product-sunglasses.jpg", price:35},
  {id:8, n:"Prism Leather Bag", cat:"footwear", img:"product-woman's bag.jpg", price:35}
];

let activeCat = 'all';
let activeSort = 'default';

function renderCatalog() {
  let list = items.filter(p => activeCat === 'all' || p.cat === activeCat);

  if (activeSort === 'low') {
    list.sort((a,b) => a.price - b.price);
  } else if (activeSort === 'high') {
    list.sort((a,b) => b.price - a.price);
  }

  document.getElementById('item-count-label').textContent = `Showing ${list.length} results`;

  document.getElementById('shop-products').innerHTML = list.map(p => `
    <div class="card">
      ${p.sale ? '<span class="badge hot">Sale!</span>' : '<span class="badge">New</span>'}
      <div class="thumb">
        <img src="Public/images/${p.img}" alt="${p.n}" onerror="this.onerror=null;this.src='https://picsum.photos/seed/${encodeURIComponent(p.n)}/220/220'">
        <button class="quick-view-btn" onclick="UrbanQuickView.open({name:'${p.n}', price:'$${p.price}', img:'${p.img}'})">
          Quick View
        </button>
      </div>
      <h4>${p.n}</h4>
      <div class="stars">${p.star ? '★★★★★' : '★★★★☆'}</div>
      <div class="price">
        ${p.old ? `<span class="old">${p.old}</span>` : ''}
        <span class="now">$${p.price}</span>
      </div>
      <div class="card-actions">
        <button class="card-add-btn" onclick="UrbanCart.add({name:'${p.n}', price:${p.price}, img:'${p.img}'})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          Add to Bag
        </button>
      </div>
    </div>
  `).join('');

  init3DTilt();
}

function filterCategory(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCatalog();
}

function sortProducts(val) {
  activeSort = val;
  renderCatalog();
}

document.addEventListener('DOMContentLoaded', () => {
  renderCatalog();
});
</script>
</body>
</html>
